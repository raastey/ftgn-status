name: Status Page

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "status/**"
      - ".github/workflows/status-page.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate latest status snapshot
        run: node status/scripts/check-status.mjs
        continue-on-error: true
        env:
          PUBLIC_STATUS_URL: https://raastey.github.io/ftgn-status/data/status.json

      # Commits the refreshed snapshot back to the repo so GitHub sees real
      # activity every run. Without this, the repo goes 60 days with no
      # commits (this job only ever uploads a Pages artifact) and GitHub
      # auto-disables the cron schedule (`disabled_inactivity`), which
      # silently stopped this page updating for three weeks before.
      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/data/status.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh status snapshot [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: status

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
