name: Status Page

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "status/**"
      - ".github/workflows/status-page.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate latest status snapshot
        run: node status/scripts/check-status.mjs
        continue-on-error: true
        env:
          PUBLIC_STATUS_URL: https://raastey.github.io/ftgn-status/data/status.json

      # Commits a tiny heartbeat file so GitHub sees real repo activity every
      # run. Without this, the repo goes 60 days with no commits (this job
      # only ever uploads a Pages artifact) and GitHub auto-disables the cron
      # schedule (`disabled_inactivity`), which silently stopped this page
      # updating for three weeks before. Deliberately NOT status.json itself:
      # it's ~3MB and rewritten (mostly-changed, since history is prepended)
      # on every run, which would bloat the repo's git history badly over
      # months for no benefit — status.json only needs to reach the Pages
      # artifact, not live in git history.
      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > status/data/.last-run
          git add status/data/.last-run
          git diff --cached --quiet && exit 0
          git commit -m "chore: heartbeat [skip ci]"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: status

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
